
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Study Planner</h1>
        <p>Plan your day. Achieve your goals.</p>
        <button id="themeToggle">🌙 Dark Mode</button>
    </header>

    <main>
        <section class="task-section">
            <h2>My Study Tasks</h2>
                
<div class="dashboard">

    <div class="stat-card">
        <h3>Total Tasks</h3>
        <p id="totalTasks">0</p>
    </div>

    <div class="stat-card">
        <h3>Completed</h3>
        <p id="completedTasks">0</p>
    </div>

    <div class="stat-card">
        <h3>Pending</h3>
        <p id="pendingTasks">0</p>
    </div>

</div>

<div class="progress-section">
    <h3>Study Progress</h3>

    <div class="progress-bar">
        <div id="progressFill"></div>
    </div>

    <p id="progressText">0% Completed</p>
</div>


            
<div class="task-input">

    <input type="text" id="taskInput"
           placeholder="Enter your study task">

    <select id="subjectInput">
        <option value="">Select Subject</option>
        <option value="Java">Java</option>
        <option value="DSA">DSA</option>
        <option value="Aptitude">Aptitude</option>
        <option value="Web Development">Web Development</option>
    </select>

    <button id="addTaskBtn">Add Task</button>

</div>

<div class="filter-section">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
    <button class="filter-btn" data-filter="pending">Pending</button>
</div>



            <ul id="taskList"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
